name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck on shell scripts
        run: bash scripts/hooks/lint-shell-all.sh

  chezmoi-validate:
    name: Chezmoi Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
          echo "Installed chezmoi version:"
          chezmoi --version

      - name: Validate template syntax
        run: |
          echo "=== Template Syntax Validation ==="

          FAILED=0
          FOUND=0

          # Use process substitution to avoid word splitting on filenames
          while IFS= read -r tmpl; do
            [ -z "$tmpl" ] && continue
            FOUND=1
            echo "Validating: $tmpl"

            # .chezmoi.toml.tmpl uses init-time functions (promptBoolOnce etc.)
            # that require --init flag to be available in execute-template
            if [ "$(basename "$tmpl")" = ".chezmoi.toml.tmpl" ]; then
              EXEC_ARGS="--init"
            else
              EXEC_ARGS=""
            fi

            # --source .: resolve include() against the checkout, not the
            # runner's default ~/.local/share/chezmoi (empty on CI)
            if ! chezmoi --source . execute-template $EXEC_ARGS --file "$tmpl" > /dev/null 2>&1; then
              echo "ERROR: Invalid template syntax in $tmpl"
              chezmoi --source . execute-template $EXEC_ARGS --file "$tmpl" 2>&1 || true
              FAILED=1
            fi
          done < <(find . -name "*.tmpl" -type f 2>/dev/null)

          if [ $FOUND -eq 0 ]; then
            echo "No template files found"
            exit 0
          fi

          echo ""
          if [ $FAILED -eq 1 ]; then
            echo "ERROR: Template validation failed"
            exit 1
          fi

          echo "OK: All templates have valid syntax"

      - name: Run chezmoi doctor
        run: |
          echo "=== Chezmoi Doctor ==="
          chezmoi doctor --no-network || true

      - name: Verify chezmoi configuration
        run: |
          echo "=== Chezmoi Configuration Check ==="

          brew_env_target="$(chezmoi --source . target-path dot_homebrew/brew.env)"
          expected_brew_env_target="$HOME/.homebrew/brew.env"
          if [ "$brew_env_target" != "$expected_brew_env_target" ]; then
            echo "ERROR: dot_homebrew/brew.env maps to '$brew_env_target', expected '$expected_brew_env_target'" >&2
            exit 1
          fi

          # Check that managed files can be listed (excluding encrypted)
          echo "Managed files (excluding encrypted):"
          chezmoi managed --include=files --exclude=encrypted 2>/dev/null || true

          echo ""
          echo "OK: Configuration appears valid"

  codex-pr-review-bundle:
    name: Codex pr-review Bundle
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # verify_pr_review_bundle.py uses stdlib tomllib, available on Python 3.11+.
          python-version: "3.13"

      - name: Validate bundled Codex agents and licenses
        run: python3 tests/codex/verify_pr_review_bundle.py

      - name: Validate pr-review verifier fail-closed behavior
        run: python3 tests/codex/test_verify_pr_review_bundle_negative.py

      - name: Validate finding-verifier result and evidence contracts
        run: |
          python3 tests/codex/test_pr_review_finding_verifier_contract.py
          python3 tests/codex/test_pr_review_finding_evidence.py

      - name: Validate pr-review base-resolution abnormal paths
        run: python3 tests/codex/test_pr_review_base_resolution.py

      - name: Validate pr-review V2 scheduler abnormal paths
        run: python3 tests/codex/test_pr_review_v2_scheduler.py

  claude-pr-review-workflow:
    name: Claude pr-review Workflow Logic
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The harness is ESM with top-level await and requires Node 20+; the
      # runner image's preinstalled Node is not guaranteed (apt nodejs ships
      # v18 on Ubuntu 24.04). Pinned to current Active LTS (Node 24).
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run pr-review workflow logic tests
        run: node tests/claude/test_pr_review_workflow.mjs

  fish-syntax:
    name: Fish Syntax Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish shell
        run: |
          sudo apt-get update
          sudo apt-get install -y fish
          fish --version

      - name: Fish syntax check
        run: |
          echo "=== Fish Syntax Check ==="
          FAILED=0

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Checking: $f"
            fish -n "$f" || FAILED=1
          done < <(find private_dot_config/private_fish \
              -type f -name "*.fish" 2>/dev/null)

          if [ $FAILED -eq 1 ]; then
            echo "ERROR: fish syntax check failed"
            exit 1
          fi
          echo "OK: fish syntax check passed"

  bats-tests:
    name: Bats Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bats and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats fish jq shellcheck
          bats --version
          fish --version

      - name: Install Herdr with Homebrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          brew install bash chezmoi herdr
          bash5_bin="$(brew --prefix bash)/bin/bash"
          "$bash5_bin" -c 'printf "Bats interpreter: %s %s\n" "$BASH" "$BASH_VERSION"; (( BASH_VERSINFO[0] >= 5 ))'
          echo "BASH5_BIN=$bash5_bin" >> "$GITHUB_ENV"
          echo "${bash5_bin%/*}" >> "$GITHUB_PATH"
          herdr --version

      - name: Validate managed Herdr configuration
        env:
          HERDR_CONFIG_PATH: ${{ github.workspace }}/private_dot_config/herdr/config.toml
        run: herdr config check

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Prepare isolated config policy dependencies
        run: |
          policy_test_root=$(mktemp -d)
          XDG_DATA_HOME="$policy_test_root/data" UV_CACHE_DIR="$policy_test_root/cache" sh scripts/codex-config/setup.sh
          echo "CODEX_CONFIG_TEST_PYTHON=$policy_test_root/data/codex-config-policy/venv/bin/python" >> "$GITHUB_ENV"

      - name: Run bats test suite
        run: |
          export PATH="${BASH5_BIN%/*}:$PATH"
          "$BASH5_BIN" "$(command -v bats)" tests/bats/

  codex-config-policy:
    name: Codex Config Policy (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "uv-managed"
          - os: macos-15
            python: "uv-managed"
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.python != 'uv-managed'
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install chezmoi for isolated integration tests
        run: |
          mkdir -p "$RUNNER_TEMP/policy-bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/policy-bin"
          echo "$RUNNER_TEMP/policy-bin" >> "$GITHUB_PATH"
      - name: Prepare dependencies and test
        env:
          POLICY_TEST_PYTHON: ${{ matrix.python }}
        run: |
          policy_test_root=$(mktemp -d)
          export UV_CACHE_DIR="$policy_test_root/cache"
          if [ "$POLICY_TEST_PYTHON" = uv-managed ]; then
            XDG_DATA_HOME="$policy_test_root/data" sh scripts/codex-config/setup.sh
          else
            XDG_DATA_HOME="$policy_test_root/data" sh scripts/codex-config/setup.sh "$(command -v python3)"
          fi
          "$policy_test_root/data/codex-config-policy/venv/bin/python" -B tests/codex/test_config_policy.py
          "$policy_test_root/data/codex-config-policy/venv/bin/python" -B tests/codex/test_config_setup.py

  bash5-macos-tests:
    name: Bash 5 macOS Tests
    runs-on: macos-15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and verify Bash 5 and bats-core
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install bash bats-core fish jq shellcheck chezmoi
          bash5_bin="$(brew --prefix bash)/bin/bash"
          bats_bin="$(brew --prefix bats-core)/bin/bats"
          test -x "$bash5_bin"
          test -x "$bats_bin"
          if ! "$bash5_bin" -c '(( BASH_VERSINFO[0] >= 5 ))'; then
            echo "ERROR: $bash5_bin must be Bash 5+" >&2
            "$bash5_bin" --version >&2 || true
            exit 1
          fi
          {
            echo "BASH5_BIN=$bash5_bin"
            echo "BATS_BIN=$bats_bin"
          } >>"$GITHUB_ENV"

      - name: Run Bash 5 runtime tests
        run: |
          export PATH="${BASH5_BIN%/*}:$PATH"
          "$BASH5_BIN" "$BATS_BIN" \
            tests/bats/test_bash5_runtime.bats \
            tests/bats/test_bash_entrypoints.bats \
            tests/bats/test_hooks.bats \
            tests/bats/test_codex_hooks.bats \
            tests/bats/test_hook_lint.bats \
            tests/bats/test_hw.bats \
            tests/bats/test_secret_scanning_baseline.bats \
            tests/bats/test_codex_fugu.bats \
            tests/bats/test_reviewed_upgrade_common.bats \
            tests/bats/test_brew_reviewed_cask_upgrade.bats \
            tests/bats/test_brew_reviewed_upgrade.bats \
            tests/bats/test_ghostty_theme.bats \
            tests/bats/test_preview.bats

      - name: Run Codex launcher tests with Homebrew Bash
        run: |
          export PATH="${BASH5_BIN%/*}:$PATH"
          "$BASH5_BIN" -c 'printf "Launcher interpreter: %s %s\n" "$BASH" "$BASH_VERSION"; (( BASH_VERSINFO[0] >= 5 ))'
          "$BASH5_BIN" "$BATS_BIN" tests/bats/test_codex_launchers.bats

  protected-outer-loop-history:
    name: Protected Outer Loop History
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository with protected history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Verify immutable outer-loop history
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/outer_loop_history -p 'test_*.py'

      - name: Reject Python bytecode artifacts
        run: |
          test -z "$(find tests/outer_loop_history -type d -name __pycache__ -print)"
          test -z "$(find tests/outer_loop_history -type f -name '*.pyc' -print)"
