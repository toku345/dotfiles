# 時雨堂 fork (910e68d8c1) の未使用 DSH ホームに一度だけ配置する設定例。
# 既存環境には適用しない。認証情報は端末ごとに設定する。
- id: llm-pi-ai
  config:
    # config 全体の置き換えでも、fork の標準値を維持する。
    chatGptSignIn: true
    # プロバイダーの追加だけを共有し、モデル一覧は DSH 内蔵カタログに従う。
    providers:
      openai-codex: {}
      ollama-cloud:
        apiKeyEnv: OLLAMA_CLOUD_API_KEY

# 標準の経路ではなく、検索・取得ともに Ollama Cloud を使う。
- id: web
  config:
    searchProvider: ollama-cloud-search
    fetchProvider: ollama-cloud-fetch
