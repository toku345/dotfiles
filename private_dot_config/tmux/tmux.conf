# =============================================================================
# Common Usage (prefix: C-t)
# =============================================================================
#
# Window:
#   C-t C-c     Create new window
#   C-t C-n/C-p Next / Previous window
#   C-t &       Kill window
#
# Pane:
#   C-t %       Split vertically
#   C-t "       Split horizontally
#   C-t o       Switch to next pane
#   C-t C-o     Switch to last pane
#   C-t x       Kill pane
#   C-t z       Toggle pane zoom
#
# Copy mode (emacs):
#   C-t [       Enter copy mode
#   C-Space     Start selection
#   M-w         Copy to clipboard (Option+w)
#   C-t ]       Paste from tmux buffer
#   C-g / q     Exit copy mode
#
# Session:
#   C-t d       Detach
#   C-t s       List sessions
#
# =============================================================================

## configuration ##
set -g history-limit 50000
# Let escape sequences from the active pane reach the outer terminal
# (Claude Code notifications, image protocols in Ghostty)
# ref: https://code.claude.com/docs/en/terminal-config#terminal-notifications
set -g allow-passthrough on
set -g focus-events on

## mouse ##
# Wheel events enter copy-mode and scroll the scrollback buffer.
# Without `mouse on`, wheel up/down is forwarded to the shell as arrow keys
# (xterm `alternateScroll` semantics; supported by Ghostty / iTerm2 / xterm)
# and walks through command history.
#
# Hold Shift from before mouse-down to bypass tmux mouse capture and fall
# back to the terminal's native selection (Ghostty default; controlled by
# `mouse-shift-capture = false`). Modifier state is sampled at click start,
# so pressing Shift mid-drag is too late.
set -g mouse on

## change prefix ##
unbind-key C-b

## key bind ##
set-option -g prefix C-t
bind-key C-t send-prefix
bind-key C-n next-window
bind-key C-p previous-window
bind-key C-c new-window
bind-key C-o last-pane

## window ##
# Renumber windows when one is closed
set -g renumber-windows on

## terminal ##
# Enable 256 colors and TrueColor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Extended keys (modified Enter: Shift/Ctrl/Alt). Without this, tmux reports
# them as plain Enter and TUIs (pi, Codex CLI, Claude Code) cannot distinguish.
# Requires tmux 3.5+ for csi-u. Opt-in per app: apps that request extended
# keys get them; others keep standard sequences.
# Ghostty remaps Shift+Enter at its own layer (keybind = shift+enter=text:\n),
# so that key is unaffected by this setting.
set -g extended-keys on
set -g extended-keys-format csi-u

# tmux requests extended keys from the outer terminal only when it believes
# the terminal supports them (the extkeys terminal-features flag). Ghostty
# reports TERM=xterm-256color and the built-in xterm* feature set has no
# extkeys, so without this line tmux never negotiates with the outer terminal
# even with extended-keys on and real modified keystrokes lose their
# modifiers before reaching a pane.
# Live-verified with these settings: a requesting pane receives S-Enter as
# CSI 13;2u, M-Enter as CSI 13;3u, C-Enter as CSI 13;5u (plain Enter stays
# CR), and pi requests mode 2 on startup instead of degrading to VT10x.
set -as terminal-features 'xterm*:extkeys'

# Reduce ESC key delay
set -s escape-time 10

## status bar ##
set -g status-fg colour253
set -g status-bg colour237

# Active window style
set-window-option -g window-status-current-style fg="colour255",bg="colour240"

set -g status-position bottom
set -g status-left '#[fg=colour32, bold]#S '
set -g status-right ''

## pane ##
# Pane border (show only with multiple panes)
set -g pane-border-status off
set -g pane-border-format "#{pane_index} #{pane_current_path} #{pane_title}"
set-hook -g after-split-window 'if -F "#{>:#{window_panes},1}" "set pane-border-status top" ""'
set-hook -g after-kill-pane 'if -F "#{<=:#{window_panes},1}" "set pane-border-status off" ""'
set-hook -g after-select-window 'if -F "#{>:#{window_panes},1}" "set pane-border-status top" "set pane-border-status off"'

## copy mode ##
set-window-option -g mode-keys emacs

# Clipboard integration via OSC52 (terminal-host bridge).
# Works on macOS, Linux, and remote SSH sessions when the host terminal
# supports OSC52 (Ghostty / iTerm2 / WezTerm / Alacritty / etc.).
set -g set-clipboard on

# Explicit finalize: copy current selection to host clipboard and exit copy-mode.
bind -T copy-mode M-w send-keys -X copy-selection-and-cancel

# Stay in copy-mode after drag-release without writing to the clipboard,
# so the selection can be extended via wheel/keys before finalizing with `M-w`.
# `q` / `Esc` aborts without touching the clipboard.
unbind -T copy-mode MouseDragEnd1Pane
