# pin: reassert on apply. seed: initialize only when absent.
# Every undeclared key is free, including unknown keys added by Codex.

[pin]
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "guardian_subagent"

[pin.sandbox_workspace_write]
network_access = false

[pin.features]
multi_agent = true
apps = true
guardian_approval = true
terminal_resize_reflow = true
memories = true
network_proxy = true
mentions_v2 = true

[pin.features.context_management]
experimental_mode = true

[pin.tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-remaining",
  "five-hour-limit",
  "codex-version",
  "pull-request-number",
  "branch-changes",
  "run-state",
  "task-progress",
]
status_line_use_colors = true

[seed]
# Model and effort are free: absent values follow Codex's defaults.
# quick/work profiles explicitly select their model and both mode efforts.
personality = "pragmatic"
