# pin: reassert on apply. seed: initialize only when absent.
# Undeclared keys are free except the retired features.multi_agent key,
# removed by merge.py when this policy pins agents.enabled.

[pin]
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "guardian_subagent"

[pin.sandbox_workspace_write]
network_access = false

[pin.agents]
enabled = true

[pin.features]
apps = true
guardian_approval = true
memories = true
network_proxy = true
mentions_v2 = true

[pin.features.context_management]
experimental_mode = true

[pin.tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-remaining",
  "five-hour-limit",
  "codex-version",
  "pull-request-number",
  "branch-changes",
  "run-state",
  "task-progress",
]
status_line_use_colors = true
whimsy = false

[seed]
personality = "pragmatic"
